[package]
name = "ecash-wallet"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Wallet library for PSP, ESP and FSP Service Points, with a thin command line"

[features]
# The integration tests that run psp-mint's, esp-mint's and fsp-mint's real AIR
# listeners against the wallet (the wallet reaches every mint over AIR only, so
# there is no HTTP form of a call to test with). They run only when this is on
# (`--all-features` has it, and the local-mints script turns on every feature).
air-listener-tests = []

[dependencies]
# mint-core is pinned to its release tag.
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
bdhke = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
# Every type the wallet exchanges with the mints, with the `seal` feature for the
# PSP payload's encryption (which needs the `air` crate, pulled in by sp-wire) and
# `air-client`, the PSP's and the ESP's calls over AIR. `air-client` needs
# `air_server` (see the [patch.crates-io] at the end).
# The wallet does not depend on the mint crates.
sp-wire = { git = "https://github.com/dav-anderson/sp-wire.git", tag = "v0.5.0", features = ["seal", "air-request", "air-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The settings file (config.toml).
toml = "0.8"
hex = "0.4.3"
sha2 = "0.10"
rand = "0.8.5"

[dev-dependencies]
mint-server = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
mint-core = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
# The tests run real mints in the process. They are dev-dependencies only: the
# library and the command line link none of them.
psp-mint = { git = "https://github.com/dav-anderson/psp-mint.git", tag = "v0.5.0" }
esp-mint = { git = "https://github.com/dav-anderson/esp-mint.git", tag = "v0.7.0" }
fsp-mint = { git = "https://github.com/dav-anderson/fsp-mint.git", tag = "v0.6.0" }
axum = "0.8"
# Only `redeem_flow` uses it, to call the in-process ESP mint's operator (admin)
# routes. The wallet itself makes no HTTP call.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[lib]
name = "ecash_wallet"
path = "src/lib.rs"

[[bin]]
name = "ecash-wallet"
path = "src/main.rs"

[[test]]
name = "flow"
required-features = ["air-listener-tests"]

[[test]]
name = "redeem_flow"
required-features = ["air-listener-tests"]

[[test]]
name = "air_flow"
required-features = ["air-listener-tests"]

[[test]]
name = "esp_air_flow"
required-features = ["air-listener-tests"]

[[test]]
name = "rotation_flow"
required-features = ["air-listener-tests"]

[[test]]
name = "psp_delivery"
required-features = ["air-listener-tests"]

[[test]]
name = "psp_reconcile"
required-features = ["air-listener-tests"]

[[test]]
name = "fsp_flow"
required-features = ["air-listener-tests"]

[[test]]
name = "handoff_flow"
required-features = ["air-listener-tests"]

# For local work, put this in .cargo/config.toml (git-ignored) or uncomment it
# here and do not commit it. See the top-level README.
#
# [patch."https://github.com/dav-anderson/sp-wire.git"]
# sp-wire = { path = "../sp-wire" }
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-types = { path = "../mint-core-v0.1.3/crates/mint-types" }
# bdhke = { path = "../mint-core-v0.1.3/crypto/bdhke" }
# mint-server = { path = "../mint-core-v0.1.3/server" }
# mint-core = { path = "../mint-core-v0.1.3/crates/mint-core" }

# sp-wire's `air-client` builds air_server 1.0.1, which takes `air` 3.0.0 from
# crates.io. This points that at the AIR sp-wire pins (3.0.0 plus the `SecretKey`
# export), or two `air` crates are built and their types do not match. sp-wire has
# the same block, but a patch applies only in the crate being built.
[patch.crates-io]
air = { git = "https://github.com/ramp-stack/air", rev = "eae5133414fca493fa80ab3facf28248df9ad65d" }
