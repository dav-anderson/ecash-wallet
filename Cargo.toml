[package]
name = "ecash-wallet"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Wallet library for PSP, ESP and FSP Service Points, with a thin command line"

[features]
default = ["http"]
# The HTTP calls to the mints, used by the command line. The rest of the library
# does no I/O except its own note file, so an app can send requests its own way.
http = ["dep:reqwest"]

[dependencies]
# mint-core is pinned to its release tag.
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
bdhke = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
# Every type the wallet exchanges with the mints, with the `seal` feature for the
# PSP payload's encryption (which needs the `air` crate, pulled in by sp-wire).
# The wallet does not depend on the mint crates.
sp-wire = { git = "https://github.com/dav-anderson/sp-wire.git", tag = "v0.4.0", features = ["seal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The settings file (config.toml).
toml = "0.8"
hex = "0.4.3"
sha2 = "0.10"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[dev-dependencies]
mint-server = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
mint-core = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
# The tests run real mints in the process. They are dev-dependencies only: the
# library and the command line link none of them.
psp-mint = { git = "https://github.com/dav-anderson/psp-mint.git", tag = "v0.3.0" }
esp-mint = { git = "https://github.com/dav-anderson/esp-mint.git", tag = "v0.5.0" }
fsp-mint = { git = "https://github.com/dav-anderson/fsp-mint.git", tag = "v0.4.0" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[[test]]
name = "redeem_flow"
required-features = ["http"]

[lib]
name = "ecash_wallet"
path = "src/lib.rs"

[[bin]]
name = "ecash-wallet"
path = "src/main.rs"
required-features = ["http"]

[[test]]
name = "rotation_flow"
required-features = ["http"]

[[test]]
name = "fsp_flow"
required-features = ["http"]

[[test]]
name = "handoff_flow"
required-features = ["http"]

# For local work, put this in .cargo/config.toml (git-ignored) or uncomment it
# here and do not commit it. See the top-level README.
#
# [patch."https://github.com/dav-anderson/sp-wire.git"]
# sp-wire = { path = "../sp-wire" }
#
# While sp-wire's AIR pin (2.1.0) has no `SecretKey` export upstream, AIR is taken
# from a local checkout that has it:
# [patch."https://github.com/ramp-stack/air"]
# air = { path = "../air" }
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-types = { path = "../mint-core-v0.1.3/crates/mint-types" }
# bdhke = { path = "../mint-core-v0.1.3/crypto/bdhke" }
# mint-server = { path = "../mint-core-v0.1.3/server" }
# mint-core = { path = "../mint-core-v0.1.3/crates/mint-core" }
